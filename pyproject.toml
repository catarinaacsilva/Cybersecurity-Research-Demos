[project]
name = "catdemos"
version = "0.1.0"
description = "Interactive demos of Catarina Silva's privacy research (IEETA)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Catarina Silva" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54",
    "websockets>=17.1",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.3",
    "joblib>=1.6",
    "scipy>=1.18.1",
]

[dependency-groups]
test = ["httpx2>=2.13.1", "coverage>=7.16.1"]

[project.scripts]
catdemos = "catdemos.__main__:main"

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catdemos = ["*/static/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "PERF"]

[tool.basedpyright]
include = ["src", "test"]
venvPath = "."
venv = "venv"
typeCheckingMode = "standard"

[tool.vulture]
paths = ["src", "test"]
min_confidence = 80
